<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>戦場に出たとき、これを再生する。</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #eye {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 2.2s ease-in-out;
    will-change: opacity;
  }

  #eye.visible {
    opacity: 1;
  }

  /* ほのかな明滅（都市伝説っぽい不穏さの演出） */
  #eye.visible {
    animation: flicker 6s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 92%, 100% { filter: brightness(1); }
    94% { filter: brightness(1.15); }
    96% { filter: brightness(0.9); }
  }

  #hint {
    position: fixed;
    bottom: 8%;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(212, 175, 55, 0.55);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 3.2vw;
    letter-spacing: 0.3em;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
    pointer-events: none;
  }

  #hint.visible {
    opacity: 1;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  #status {
    position: fixed;
    top: 5%;
    right: 6%;
    color: rgba(212, 175, 55, 0.4);
    font-family: monospace;
    font-size: 3vw;
    letter-spacing: 0.1em;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #status.visible {
    opacity: 1;
  }
</style>
</head>
<body>

<div id="stage">
  <img id="eye" src="eye.png" alt="">
  <div id="hint">TAP&nbsp;TO&nbsp;BEGIN</div>
  <div id="status"></div>
</div>

<script>
(() => {
  const eyeEl = document.getElementById('eye');
  const hintEl = document.getElementById('hint');
  const statusEl = document.getElementById('status');

  let audioCtx = null;
  let bgmBuffer = null;
  let bgmSource = null;
  let gainNode = null;

  let started = false;   // 初回タップで画像フェードイン + BGM再生 済みか
  let isPlaying = false;

  // --- 音声の事前ロード（AudioContextはユーザー操作後に生成/resumeする） ---
  async function preloadAudio() {
    try {
      const res = await fetch('bgm.wav');
      const arrayBuf = await res.arrayBuffer();
      // AudioContextが無ければ一時的に作ってデコードのみ行う
      const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
      bgmBuffer = await tempCtx.decodeAudioData(arrayBuf);
      await tempCtx.close();
    } catch (err) {
      console.error('BGM preload failed:', err);
    }
  }
  preloadAudio();

  function ensureAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 1.0;
      gainNode.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playBgm() {
    if (!bgmBuffer) return;
    ensureAudioContext();

    // 既存のソースがあれば止める
    if (bgmSource) {
      try { bgmSource.stop(); } catch (e) {}
      bgmSource.disconnect();
    }

    bgmSource = audioCtx.createBufferSource();
    bgmSource.buffer = bgmBuffer;
    bgmSource.loop = true;
    bgmSource.connect(gainNode);
    bgmSource.start(0);
    isPlaying = true;
    updateStatus();
  }

  function stopBgm() {
    if (bgmSource) {
      try { bgmSource.stop(); } catch (e) {}
      bgmSource.disconnect();
      bgmSource = null;
    }
    isPlaying = false;
    updateStatus();
  }

  function toggleBgm() {
    if (isPlaying) {
      stopBgm();
    } else {
      playBgm();
    }
  }

  function updateStatus() {
    statusEl.textContent = isPlaying ? '♪ ON' : '♪ OFF';
    statusEl.classList.add('visible');
  }

  function beginExperience() {
    ensureAudioContext();
    eyeEl.classList.add('visible');
    hintEl.classList.remove('visible');
    playBgm();
    started = true;
  }

  document.getElementById('stage').addEventListener('click', () => {
    if (!started) {
      beginExperience();
    } else {
      toggleBgm();
    }
  }, { passive: true });

  // 初回表示時、少し間を置いてヒントを出す（不穏な溜め）
  setTimeout(() => {
    hintEl.classList.add('visible');
  }, 800);
})();
</script>

</body>
</html>
