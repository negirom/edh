<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不可視の眼、これを開く。</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #eye {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 2.2s ease-in-out;
    will-change: opacity;
  }

  #eye.visible {
    opacity: 1;
  }

  /* ほのかな明滅（都市伝説っぽい不穏さの演出） */
  #eye.visible {
    animation: flicker 6s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 92%, 100% { filter: brightness(1); }
    94% { filter: brightness(1.15); }
    96% { filter: brightness(0.9); }
  }

  #hint {
    position: fixed;
    bottom: 8%;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(212, 175, 55, 0.55);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 3.2vw;
    letter-spacing: 0.3em;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
    pointer-events: none;
  }

  #hint.visible {
    opacity: 1;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  #status {
    position: fixed;
    top: 5%;
    right: 6%;
    color: rgba(212, 175, 55, 0.4);
    font-family: monospace;
    font-size: 3vw;
    letter-spacing: 0.1em;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #status.visible {
    opacity: 1;
  }

  .ufo {
    position: fixed;
    top: var(--ufo-top, 30%);
    z-index: 10;
    pointer-events: none;
    will-change: transform;
  }

  .ufo img {
    display: block;
    width: 28vw;
    height: auto;
    filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.85))
            drop-shadow(0 0 28px rgba(180, 255, 180, 0.45));
  }

  .ufo.fly-right {
    left: -30vw;
    animation: fly-right 2.6s linear forwards;
  }

  .ufo.fly-left {
    right: -30vw;
    animation: fly-left 2.6s linear forwards;
  }

  /* 右へ飛ぶ機体はそのまま、左へ飛ぶ機体は左右反転させて進行方向を向かせる */
  .ufo.fly-left img {
    transform: scaleX(-1);
  }

  @keyframes fly-right {
    0%   { transform: translateX(0) translateY(0) rotate(0deg); }
    50%  { transform: translateX(60vw) translateY(-6vh) rotate(3deg); }
    100% { transform: translateX(180vw) translateY(0) rotate(0deg); }
  }

  @keyframes fly-left {
    0%   { transform: translateX(0) translateY(0) rotate(0deg); }
    50%  { transform: translateX(-60vw) translateY(-6vh) rotate(-3deg); }
    100% { transform: translateX(-180vw) translateY(0) rotate(0deg); }
  }
</style>
</head>
<body>

<div id="stage">
  <img id="eye" src="eye.png" alt="">
  <div id="hint">TAP&nbsp;TO&nbsp;BEGIN</div>
  <div id="status"></div>
</div>

<script>
(() => {
  const eyeEl = document.getElementById('eye');
  const hintEl = document.getElementById('hint');
  const statusEl = document.getElementById('status');

  let audioCtx = null;
  let bgmBuffer = null;
  let bgmSource = null;
  let gainNode = null;
  let seBuffer = null;

  let started = false;   // 初回タップで画像フェードイン + BGM再生 済みか
  let isPlaying = false;

  // --- 音声の事前ロード（AudioContextはユーザー操作後に生成/resumeする） ---
  async function preloadAudio() {
    try {
      const tempCtx = new (window.AudioContext || window.webkitAudioContext)();

      const [bgmRes, seRes] = await Promise.all([
        fetch('bgm.wav'),
        fetch('ufo_se.mp3')
      ]);
      const [bgmArrayBuf, seArrayBuf] = await Promise.all([
        bgmRes.arrayBuffer(),
        seRes.arrayBuffer()
      ]);

      bgmBuffer = await tempCtx.decodeAudioData(bgmArrayBuf);
      seBuffer = await tempCtx.decodeAudioData(seArrayBuf);

      await tempCtx.close();
    } catch (err) {
      console.error('Audio preload failed:', err);
    }
  }
  preloadAudio();

  function ensureAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 1.0;
      gainNode.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playBgm() {
    if (!bgmBuffer) return;
    ensureAudioContext();

    // 既存のソースがあれば止める
    if (bgmSource) {
      try { bgmSource.stop(); } catch (e) {}
      bgmSource.disconnect();
    }

    bgmSource = audioCtx.createBufferSource();
    bgmSource.buffer = bgmBuffer;
    bgmSource.loop = true;
    bgmSource.connect(gainNode);
    bgmSource.start(0);
    isPlaying = true;
    updateStatus();
  }

  function stopBgm() {
    if (bgmSource) {
      try { bgmSource.stop(); } catch (e) {}
      bgmSource.disconnect();
      bgmSource = null;
    }
    isPlaying = false;
    updateStatus();
  }

  function toggleBgm() {
    if (isPlaying) {
      stopBgm();
    } else {
      playBgm();
    }
  }

  function updateStatus() {
    statusEl.textContent = isPlaying ? '♪ ON' : '♪ OFF';
    statusEl.classList.add('visible');
  }

  function beginExperience() {
    ensureAudioContext();
    eyeEl.classList.add('visible');
    hintEl.classList.remove('visible');
    playBgm();
    started = true;
  }

  const UFO_FLIGHT_DURATION = 2.6; // CSSアニメーションのdurationと合わせる（秒）

  function playUfoSe() {
    if (!seBuffer) return null;
    ensureAudioContext();

    const seSource = audioCtx.createBufferSource();
    seSource.buffer = seBuffer;
    seSource.loop = true;

    const seGain = audioCtx.createGain();
    seSource.connect(seGain);
    seGain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    const peakTime = now + UFO_FLIGHT_DURATION * 0.5; // 山の頂点＝画面中央付近＝最大音量
    const endTime = now + UFO_FLIGHT_DURATION;

    // 遠くから近づいて→最接近で最大音量→遠ざかって消えていく音量カーブ
    seGain.gain.setValueAtTime(0.0001, now);
    seGain.gain.linearRampToValueAtTime(1.4, peakTime);
    seGain.gain.linearRampToValueAtTime(0.0001, endTime);

    seSource.start(now);
    seSource.stop(endTime + 0.05);

    return { seSource, seGain };
  }

  function spawnUfo(direction) {
    // direction: 'right' = 左端から出て右へ / 'left' = 右端から出て左へ
    const ufo = document.createElement('div');
    ufo.className = `ufo fly-${direction}`;
    ufo.style.setProperty('--ufo-top', `${20 + Math.random() * 30}%`);

    const img = document.createElement('img');
    img.src = 'ufo.png';
    img.alt = '';
    ufo.appendChild(img);

    document.getElementById('stage').appendChild(ufo);

    const seNodes = playUfoSe();

    ufo.addEventListener('animationend', () => {
      ufo.remove();
      // 万一SEが残っていたら片付ける（通常はstop()で自然終了する）
      if (seNodes) {
        try { seNodes.seSource.stop(); } catch (e) {}
        seNodes.seSource.disconnect();
        seNodes.seGain.disconnect();
      }
    });
  }

  document.getElementById('stage').addEventListener('click', (e) => {
    if (!started) {
      beginExperience();
      return;
    }

    const x = e.clientX;
    const w = window.innerWidth;
    const leftZone = w * 0.35;
    const rightZone = w * 0.65;

    if (x < leftZone) {
      // 左側タップ → 右端から出て左へ飛んでいく
      spawnUfo('left');
    } else if (x > rightZone) {
      // 右側タップ → 左端から出て右へ飛んでいく
      spawnUfo('right');
    } else {
      // 中央タップ → BGM ON/OFF
      toggleBgm();
    }
  }, { passive: true });

  // 初回表示時、少し間を置いてヒントを出す（不穏な溜め）
  setTimeout(() => {
    hintEl.classList.add('visible');
  }, 800);
})();
</script>

</body>
</html>
