<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>殿が場にでるたび、これを再生する。</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #crest {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.8s ease, transform 0.15s ease;
      pointer-events: none;
    }

    #crest.visible { opacity: 1; }
    #crest.pulse   { transform: scale(1.04); }

    #zone-left, #zone-center, #zone-right {
      position: fixed;
      top: 0;
      height: 100%;
    }
    #zone-left   { left: 0;   width: 20%; cursor: pointer; }
    #zone-center { left: 20%; width: 60%; cursor: pointer; }
    #zone-right  { right: 0;  width: 20%; cursor: pointer; }

    #tap-msg {
      position: fixed;
      bottom: 2em;
      width: 100%;
      text-align: center;
      color: rgba(200, 170, 80, 0.7);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      font-family: serif;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    #tap-msg.visible { opacity: 1; }
  </style>
</head>
<body>

  <img id="crest" src="maruni_mitsuba_aoi_720x1280.jpg" alt="丸に三つ葉葵">
  <p id="tap-msg">画面をタップして音楽を再生</p>

  <div id="zone-left"></div>
  <div id="zone-center"></div>
  <div id="zone-right"></div>

  <script>
    const img   = document.getElementById('crest');
    const msg   = document.getElementById('tap-msg');
    const zoneL = document.getElementById('zone-left');
    const zoneC = document.getElementById('zone-center');
    const zoneR = document.getElementById('zone-right');

    // AudioContext
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    // バッファキャッシュ
    const buffers = {};

    async function loadBuffer(url) {
      if (buffers[url]) return buffers[url];
      const res  = await fetch(url);
      const data = await res.arrayBuffer();
      const buf  = await ctx.decodeAudioData(data);
      buffers[url] = buf;
      return buf;
    }

    // SE再生（後発優先：毎回新しいSourceNode）
    const seFiles = {
      right: ['se_kin1.mp3',   'se_kin2.mp3'],
      left:  ['se_zashu1.mp3', 'se_zashu2.mp3'],
    };
    const seIndex = { right: 0, left: 0 };
    const seNodes = { right: null, left: null };

    async function playSE(direction) {
      const files = seFiles[direction];
      const idx   = seIndex[direction];
      const buf   = await loadBuffer(files[idx]);

      // 前のSEが鳴っていたら止める
      if (seNodes[direction]) {
        try { seNodes[direction].stop(); } catch(e) {}
      }

      const source = ctx.createBufferSource();
      source.buffer = buf;
      source.connect(ctx.destination);
      source.start(0);
      seNodes[direction] = source;

      seIndex[direction] = (idx + 1) % files.length;
    }

    // BGM管理
    let bgmBuffer = null;
    let bgmSource = null;
    let bgmOffset = 0;
    let bgmStartTime = 0;
    let bgmPlaying = false;

    async function loadBGM() {
      bgmBuffer = await loadBuffer('shogun_bgm.mp3');
    }

    function startBGM() {
      if (!bgmBuffer || bgmPlaying) return;
      bgmSource = ctx.createBufferSource();
      bgmSource.buffer = bgmBuffer;
      bgmSource.loop = true;
      bgmSource.connect(ctx.destination);
      bgmSource.start(0, bgmOffset % bgmBuffer.duration);
      bgmStartTime = ctx.currentTime;
      bgmPlaying = true;
      msg.classList.remove('visible');
    }

    function stopBGM() {
      if (!bgmPlaying) return;
      bgmOffset = (bgmOffset + ctx.currentTime - bgmStartTime) % bgmBuffer.duration;
      try { bgmSource.stop(); } catch(e) {}
      bgmPlaying = false;
      msg.classList.add('visible');
    }

    function toggleBGM() {
      if (ctx.state === 'suspended') ctx.resume();
      if (bgmPlaying) {
        bgmOffset = 0; // 頭出し
        stopBGM();
      } else {
        bgmOffset = 0; // 頭から再生
        startBGM();
      }
    }

    // 初期化：ファイル読み込み
    async function init() {
      img.classList.add('visible');
      await Promise.all([
        loadBGM(),
        loadBuffer('se_kin1.mp3'),
        loadBuffer('se_kin2.mp3'),
        loadBuffer('se_zashu1.mp3'),
        loadBuffer('se_zashu2.mp3'),
      ]);

      // 自動再生トライ
      if (ctx.state === 'suspended') {
        msg.classList.add('visible');
      } else {
        startBGM();
      }
    }

    window.addEventListener('load', init);

    // パルス
    function pulse() {
      img.classList.add('pulse');
      setTimeout(() => img.classList.remove('pulse'), 150);
    }

    // 中央：BGMトグル
    zoneC.addEventListener('click', () => {
      if (ctx.state === 'suspended') ctx.resume().then(() => { bgmOffset = 0; startBGM(); });
      else toggleBGM();
      pulse();
    });

    // 左：zashu
    zoneL.addEventListener('click', () => {
      if (ctx.state === 'suspended') ctx.resume();
      playSE('left');
    });

    // 右：kin
    zoneR.addEventListener('click', () => {
      if (ctx.state === 'suspended') ctx.resume();
      playSE('right');
    });
  </script>

</body>
</html>
