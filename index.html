<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>殿が場にでるたび、これを再生する。</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }

    #crest {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.8s ease, transform 0.15s ease;
    }

    #crest.visible { opacity: 1; }
    #crest.pulse   { transform: scale(1.04); }

    #tap-msg {
      position: fixed;
      bottom: 2em;
      width: 100%;
      text-align: center;
      color: rgba(200, 170, 80, 0.7);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      font-family: serif;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    #tap-msg.visible { opacity: 1; }
  </style>
</head>
<body>

  <img id="crest" src="maruni_mitsuba_aoi_720x1280.jpg" alt="丸に三つ葉葵">
  <audio id="bgm" src="shogun_bgm.mp3" loop></audio>
  <p id="tap-msg">画面をタップして音楽を再生</p>

  <script>
    const img   = document.getElementById('crest');
    const audio = document.getElementById('bgm');
    const msg   = document.getElementById('tap-msg');

    // SE 定義（後発優先のため毎回 new Audio で即時生成）
    const seFiles = {
      right: ['se_kin1.mp3',   'se_kin2.mp3'],
      left:  ['se_zashu1.mp3', 'se_zashu2.mp3'],
    };
    const seIndex = { right: 0, left: 0 };

    function playSE(direction) {
      const files = seFiles[direction];
      const idx   = seIndex[direction];
      const se    = new Audio(files[idx]);
      se.play();
      seIndex[direction] = (idx + 1) % files.length;
    }

    // フェードイン
    window.addEventListener('load', () => {
      img.classList.add('visible');
    });

    // BGM 自動再生
    function tryPlay() {
      audio.play().then(() => {
        msg.classList.remove('visible');
      }).catch(() => {
        msg.classList.add('visible');
      });
    }
    window.addEventListener('load', tryPlay);

    // パルスアニメ
    function pulse() {
      img.classList.add('pulse');
      setTimeout(() => img.classList.remove('pulse'), 150);
    }

    // タップ／フリック判定
    const FLICK_THRESHOLD = 30; // px：これ以上横に動いたらフリックと判定
    let startX = 0;
    let startY = 0;
    let moved  = false;

    document.body.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      moved  = false;
    }, { passive: true });

    document.body.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;

      if (Math.abs(dx) > FLICK_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
        // フリック
        moved = true;
        playSE(dx > 0 ? 'right' : 'left');
      } else if (!moved) {
        // タップ
        pulse();
        if (audio.paused) {
          audio.currentTime = 0;
          audio.play();
          msg.classList.remove('visible');
        } else {
          audio.pause();
          audio.currentTime = 0;
          msg.classList.add('visible');
        }
      }
    });

    // マウスクリック（PC確認用）
    document.body.addEventListener('click', (e) => {
      if (moved) { moved = false; return; }
      pulse();
      if (audio.paused) {
        audio.currentTime = 0;
        audio.play();
        msg.classList.remove('visible');
      } else {
        audio.pause();
        audio.currentTime = 0;
        msg.classList.add('visible');
      }
    });
  </script>

</body>
</html>
