<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>殿が場にでるたび、これを再生する。</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #crest {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.8s ease, transform 0.15s ease;
      pointer-events: none;
    }

    #crest.visible { opacity: 1; }
    #crest.pulse   { transform: scale(1.04); }

    /* タップゾーン3分割（透明） */
    #zone-left, #zone-center, #zone-right {
      position: fixed;
      top: 0;
      height: 100%;
    }
    #zone-left   { left: 0;    width: 20%; cursor: pointer; }
    #zone-center { left: 20%;  width: 60%; cursor: pointer; }
    #zone-right  { right: 0;   width: 20%; cursor: pointer; }

    #tap-msg {
      position: fixed;
      bottom: 2em;
      width: 100%;
      text-align: center;
      color: rgba(200, 170, 80, 0.7);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      font-family: serif;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    #tap-msg.visible { opacity: 1; }
  </style>
</head>
<body>

  <img id="crest" src="maruni_mitsuba_aoi_720x1280.jpg" alt="丸に三つ葉葵">
  <audio id="bgm" src="shogun_bgm.mp3" loop></audio>
  <p id="tap-msg">画面をタップして音楽を再生</p>

  <div id="zone-left"></div>
  <div id="zone-center"></div>
  <div id="zone-right"></div>

  <script>
    const img    = document.getElementById('crest');
    const audio  = document.getElementById('bgm');
    const msg    = document.getElementById('tap-msg');
    const zoneL  = document.getElementById('zone-left');
    const zoneC  = document.getElementById('zone-center');
    const zoneR  = document.getElementById('zone-right');

    // SE（後発優先：毎回 new Audio で即時生成）
    const seFiles = {
      right: ['se_kin1.mp3',   'se_kin2.mp3'],
      left:  ['se_zashu1.mp3', 'se_zashu2.mp3'],
    };
    const seIndex = { right: 0, left: 0 };

    function playSE(direction) {
      const files = seFiles[direction];
      const idx   = seIndex[direction];
      const se    = new Audio(files[idx]);
      se.play();
      seIndex[direction] = (idx + 1) % files.length;
    }

    // フェードイン
    window.addEventListener('load', () => {
      img.classList.add('visible');
    });

    // BGM 自動再生
    function tryPlay() {
      audio.play().then(() => {
        msg.classList.remove('visible');
      }).catch(() => {
        msg.classList.add('visible');
      });
    }
    window.addEventListener('load', tryPlay);

    // パルスアニメ
    function pulse() {
      img.classList.add('pulse');
      setTimeout(() => img.classList.remove('pulse'), 150);
    }

    // 中央：BGMトグル
    zoneC.addEventListener('click', () => {
      pulse();
      if (audio.paused) {
        audio.currentTime = 0;
        audio.play();
        msg.classList.remove('visible');
      } else {
        audio.pause();
        audio.currentTime = 0;
        msg.classList.add('visible');
      }
    });

    // 左：zashu
    zoneL.addEventListener('click', () => {
      playSE('left');
    });

    // 右：kin
    zoneR.addEventListener('click', () => {
      playSE('right');
    });
  </script>

</body>
</html>
